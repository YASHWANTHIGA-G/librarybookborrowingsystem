# Application Settings
spring.application.name=library-management-system
spring.profiles.active=mysql
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Spring Mail (JavaMailSender / SMTP) Configuration (Localhost / Paid Render Tier)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:310625205313@eec.srmrmp.edu.in}
spring.mail.password=${SPRING_MAIL_PASSWORD:oicsskossuauhssm}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.localhost=localhost

# HTTP Mail Dispatcher (Bypasses Render Free Tier SMTP port block via HTTPS Port 443)
mail.relay.url=${MAIL_RELAY_URL:https://script.google.com/macros/s/AKfycbxh_AlMUZnUKup3ApfBXIBCkEEtXQRQCicByor9MSiyTeHEacbBnJQkX2e71IF4axSf/exec}
mail.brevo.api-key=${BREVO_API_KEY:}
mail.resend.api-key=${RESEND_API_KEY:}

# Default Sender Email
library.mail.from=${LIBRARY_MAIL_FROM:noreply.library@college.edu}
library.loan.duration-days=14

# Logging
logging.level.com.college.library=INFO
logging.level.org.springframework.mail=INFO
